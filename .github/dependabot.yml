version: 2

# No `labels:` on any entry. Specifying it *overrides* dependabot's defaults
# rather than adding to them, and a custom label that doesn't exist in the repo
# is silently ignored, never created. This file used to ask for "dependencies",
# "pre-commit" and "github-actions" — none of which exist here, since the repo
# carries only GitHub's nine stock labels — so the override cancelled the
# defaults, the replacements were dropped, and every dependabot PR merged with
# no label at all. Left unset, dependabot applies its own and creates them.
updates:
  # Bump the pinned `rev`s in .pre-commit-config.yaml. Deliberately not listing
  # which hooks — that list named black, shfmt and relint long after they left
  # the config, and would rot again on the next hook added.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Don't propose a release until it has been public for a week. A
    # compromised package is usually yanked within days of publication, so the
    # delay costs nothing here (monthly interval) and drops the window in which
    # dependabot would open a PR for one.
    cooldown:
      default-days: 7
    # The repo has no requirements.txt — this ecosystem entry is here only so
    # dependabot's pre-commit detection (it reads .pre-commit-config.yaml under
    # the pip ecosystem) is enabled. Native pre-commit support landed in 2023.

  # Bump action versions in .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # This is what keeps the SHA pins in .github/zizmor.yml maintainable —
    # dependabot rewrites both the hash and its trailing version comment.
    cooldown:
      default-days: 7
