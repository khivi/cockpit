name: publish

# On a pushed `v<version>` tag: build sdist + wheel and publish to PyPI as the
# `cmux-cockpit` distribution (the import package + `cockpit` console script
# are unchanged — only the PyPI name differs, since bare "cockpit" collides
# with Red Hat's Cockpit web console). Runs alongside release.yml (which bumps
# the Homebrew tap) on the same tag; the two are independent.
#
# Like release.yml, it first verifies the tag matches pyproject.toml — a
# mismatch here is unrecoverable, since PyPI refuses a re-upload of a version.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in this repo.
# One-time setup on pypi.org (project owner only):
#   1. https://pypi.org/manage/account/publishing/ → "Add a new pending publisher"
#   2. PyPI project name: cmux-cockpit
#   3. Owner: khivi   Repository: cockpit   Workflow: publish.yml   Environment: pypi
# PyPI creates the project on first successful publish from that pending
# publisher — no manual `pypi.org/project/cmux-cockpit` creation needed first.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify tag matches pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG#v}"
          proj="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag pyproject=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $proj — bump pyproject before tagging"
            exit 1
          fi

      # Deliberately uncached, unlike ci.yml. A restored cache is attacker-
      # influenced input, and here it would feed `uv build` — whose output is
      # uploaded to PyPI under this repo's OIDC identity, unreviewed. The job
      # runs once per tag and resolves one dependency, so the cache saves
      # seconds and risks the published artifact. `enable-cache` must be set
      # explicitly — omitting it caches, it does not opt out.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
