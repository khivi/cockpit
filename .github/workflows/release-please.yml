name: release-please

# Keeps a rolling `chore(main): release <version>` PR open against `main`,
# accumulating every conventional commit merged since the last release and
# deriving the semver bump from their types (`feat` -> minor, `fix` -> patch).
# Merging that PR bumps `[project] version` in pyproject.toml — which is exactly
# the trigger tag.yml already watches — so the tag, the Homebrew tap bump
# (release.yml) and the PyPI upload (publish.yml) all follow unchanged. The one
# human step is merging the release PR. See AGENTS.md "Release versioning".
#
# `skip-github-release: true` is load-bearing, for the same reason tag.yml
# exists in the shape it does. Left to default, release-please would push the
# tag and cut the GitHub release itself — duplicating tag.yml, and doing it
# under a token whose pushes do not trigger other workflows, so release.yml and
# publish.yml would silently never run. tag.yml stays the only tagger; this
# workflow only ever writes the release PR.
#
# `skip-labeling: true` is the necessary companion to that, not a tidiness
# setting. release-please tracks release state on the *label* of the merged
# release PR: it opens the PR as `autorelease: pending` and flips it to
# `autorelease: tagged` in the release step — the very step skip-github-release
# turns off. So the label never flips, and every later run finds that PR still
# pending and aborts with "There are untagged, merged release PRs outstanding"
# *before* proposing the next version. That wedged the pipeline after v1.8.0:
# 1.9.0's PR was never opened and a merged feature sat unshipped. Note the state
# is the label, NOT a GitHub Release — cutting the missing Release for the tag
# does not clear it. With labeling off there is no pending PR to find, and the
# version baseline still comes from .release-please-manifest.json plus the git
# tags, which is all this workflow needs.
#
# The job's `if:` guard is the third load-bearing setting here, and it exists
# because this workflow re-runs on the very commit it causes. Merging the
# release PR is a push to `main`, so release-please and tag.yml both fire on
# that sha and race: tag.yml pushes `v<version>` about a minute later, so at the
# moment release-please starts, the tag for the release just merged does not
# exist yet. With no baseline tag it treats the repo as never released and
# regenerates the changelog from the entire history — PR #309 proposed 1.10.0
# with a 225-line CHANGELOG replaying PRs shipped long before, on a `main` with
# zero commits since v1.9.0. It looks plausible because the version comes from
# .release-please-manifest.json rather than from a tag. Nothing is ever
# releasable on this push (the release PR just consumed every pending commit),
# so skipping loses no coverage and the next real feature merge opens a correct,
# tag-bounded PR. The guard matches release-please's own PR title, so do not set
# `pull-request-title-pattern` in release-please-config.json without updating it
# here. cut-release.sh commits `chore(release): <version>` — a different prefix,
# so a manual release still triggers a run, which is right: it tags out of band.
#
# It runs under COCKPIT_GITHUB_API_TOKEN rather than the default GITHUB_TOKEN
# for the other half of that recursion rule: a pull request opened by
# GITHUB_TOKEN does not trigger workflows, so the release PR would sit forever
# with none of `main`'s required checks (ci, pre-commit, lint-pr-title) ever
# reporting, and could not be merged.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    # Skip the push that merged the release PR — its tag does not exist yet.
    if: "!startsWith(github.event.head_commit.message, 'chore(main): release')"
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.COCKPIT_GITHUB_API_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          skip-labeling: true
