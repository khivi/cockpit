name: release

# On a pushed `v<version>` tag: verify it matches pyproject.toml, then bump the
# Homebrew tap (khivi/homebrew-cockpit) formula's `url` + `sha256` to this tag
# so `brew upgrade cockpit` picks it up. The action downloads the tag tarball,
# computes its sha256, and commits the bump directly onto the tap's default
# branch (it has push access via the PAT below — no PR to merge by hand).
#
# The tag must be pushed on the *merged* main commit carrying the version bump:
# the verify step below re-reads pyproject.toml at the tag and fails on a
# mismatch. See AGENTS.md "Release versioning".
#
# The Python `resource` blocks (Textual + its deps) change only on a dependency
# bump, NOT every release — this CI leaves them untouched. Regenerate them by
# hand when deps move: `brew update-python-resources Formula/cockpit.rb`.
#
# `create-branch: false` is load-bearing: the action branches (then opens a PR)
# whenever the tap's base branch reports `protected`, and the tap's `main` has a
# ruleset so it always does. That PR needs `Pull requests: write` on the tap,
# which the PAT lacks — it 403'd *after* pushing a correct `update-cockpit.rb-*`
# branch, so v1.5.1 and v1.6.0 silently never reached the tap. The ruleset only
# blocks deletion + non-fast-forward, so a direct commit is allowed.
#
# Requires an Actions secret `COCKPIT_GITHUB_API_TOKEN`: a PAT with Contents
# write on khivi/homebrew-cockpit (the default GITHUB_TOKEN can't write to a
# different repo).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bump-tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG#v}"
          proj="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag pyproject=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $proj — bump pyproject before tagging"
            exit 1
          fi

      - name: Bump Homebrew tap formula
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: cockpit
          homebrew-tap: khivi/homebrew-cockpit
          download-url: https://github.com/khivi/cockpit/archive/refs/tags/${{ github.ref_name }}.tar.gz
          # Commit straight onto the tap's main — see the note above.
          create-branch: false
        env:
          COMMITTER_TOKEN: ${{ secrets.COCKPIT_GITHUB_API_TOKEN }}
