repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.20.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-json
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: check-toml
      - id: debug-statements
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        exclude: ^\.envrc$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ['--fix']
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: ['--config', '.markdownlint.yaml']
        # CHANGELOG.md is generated by release-please, which writes `*` bullets
        # into a file that was hand-written with `-` ones — MD004 then fails the
        # release PR, and the fix is never to hand-edit a generated file.
        exclude: '^CHANGELOG\.md$'

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ['--config', '.codespellrc']

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: python
        additional_dependencies: [pytest==9.1.1, pytest-asyncio==1.4.0, pytest-xdist==3.8.0, textual>=8.2.8]
        # Half the suite's wall clock is idle time waiting on the real `git` /
        # `gh` / `cmux` subprocesses the leaf-module tests shell out to (115s
        # wall for 60s of CPU), so it parallelises near-linearly: 115s -> 32s on
        # a 4-core CI runner, -> 16s on an 18-core laptop. `auto` reads the core
        # count, so it is right in both places.
        #
        # Deliberately NOT in `[tool.pytest.ini_options] addopts` — worker boot
        # costs ~2s, which is pure tax on the `pytest path::test` runs you do
        # while iterating. This hook is the full-suite entry point (CI runs it
        # as `pre-commit run --all-files --hook-stage pre-push`), so the cost is
        # only paid where there is a suite to amortise it over.
        #
        # Default `--dist load` (per-test round-robin), not `loadfile`: the one
        # module-scoped fixture (`tests/e2e/test_wheel_packaging.py::built_wheel`)
        # builds into a per-worker `tmp_path_factory` dir, so re-running it per
        # worker is wasted work, never a collision. `loadfile` would serialise
        # each file onto one worker and measured slower (47s vs 32s) — the
        # biggest file becomes the floor.
        args: ['-n', 'auto']
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: mypy
        name: mypy type check
        entry: mypy
        language: python
        additional_dependencies: [mypy==2.3.0, pytest==9.1.1, textual>=8.2.8]
        args: ['cockpit/', 'tests/']
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: uv-audit
        name: uv audit (dependency vulnerabilities)
        entry: uv audit --preview-features audit-command
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
